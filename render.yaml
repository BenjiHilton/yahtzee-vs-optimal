# One-click deploy to Render (https://render.com) -- free tier.
# Create a new "Blueprint" from your Git repo and Render reads this file.
services:
  - type: web
    name: yahtzee-vs-optimal
    runtime: python
    plan: free
    region: frankfurt   # EU (Germany) -- much lower latency from UK/Europe than US
    buildCommand: pip install -r requirements.txt
    startCommand: python -m webapp.server
    # Render injects $PORT; the server already binds 0.0.0.0:$PORT.
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /
